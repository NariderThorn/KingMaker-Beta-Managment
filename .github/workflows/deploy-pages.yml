# Publishes the web/ folder as the website version of Kingdom Ledger
# (used by iPhone "Add to Home Screen" and any browser):
#   https://nariderthorn.github.io/KingMaker-Beta-Managment/
# Runs on every push to main. One-time setup: repo Settings → Pages →
# Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
